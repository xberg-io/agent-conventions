version = "5.0"
name = "agent-conventions"
description = "Shared agent-conventions modules for xberg.io polyglot projects"
gitignore = true
gitignore_exclude = [".ai-rulez/.generated-manifest.json", "skills/"]

presets = [
  "claude",
  "codex",
  "opencode",
  "pi",
  { name = "public-skills", provider = ".ai-rulez/providers/public-skills.toml" },
]

builtins = ["!git-workflow", "!testing", "code-quality", "security", "token-efficiency", "default-commands"]

compact = true
default_layers = ["plugins"]

[[mcp_servers]]
name = "github"
description = "GitHub integration for repository operations and automation"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
transport = "stdio"
enabled = false

[mcp_servers.env]
GITHUB_PERSONAL_ACCESS_TOKEN = "${GITHUB_TOKEN}"

[[mcp_servers]]
name = "ai-rulez"
description = "AI-Rulez MCP server for configuration management"
command = "ai-rulez"
args = ["mcp"]
transport = "stdio"
enabled = true

[mcp]
self_server = false

[lock]
include_outputs = false

[[includes]]
name = "public-core"
source = "modules/core"
include = ["skills"]

[[includes]]
name = "public-cicd"
source = "modules/cicd"
include = ["skills"]

[[includes]]
name = "public-languages"
source = "modules/languages"
include = ["skills"]

[[includes]]
name = "public-infrastructure"
source = "modules/infrastructure"
include = ["skills"]

[[includes]]
name = "public-e2e-generator"
source = "modules/e2e-generator"
include = ["skills"]
