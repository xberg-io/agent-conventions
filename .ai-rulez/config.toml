version = "5.0"
name = "agent-conventions"
description = "Shared ai-rulez modules for the organization's repositories"
gitignore = true
gitignore_exclude = [".ai-rulez/.generated-manifest.json", "skills/"]

presets = [
  "claude",
  "codex",
  "opencode",
  { name = "public-skills", provider = ".ai-rulez/providers/public-skills.toml" },
]

builtins = [
  "!agent-delegation",
  "!git-workflow",
  "!testing",
  "!ai-governance/agent-workflow",
  "code-quality",
  "security",
  "token-efficiency",
  "default-commands",
  "!token-efficiency/output-awareness",
  "!token-efficiency/task-runner",
  "!ai-governance/explain-reasoning",
  "!security/least-privilege",
  "!security/input-validation",
]

compact = true
default_layers = ["plugins"]

[rules]
scoped_fallback = "skill"

# Skill discovery needs two tools; the full server lists every CRUD tool at each start. Maintainers who
# want the full server put it in config.local.toml. ~keep
[mcp]
self_server_command = ["ai-rulez", "mcp"]
serve_skills = true
read_only = true
discover_skills = "repo"
tools = ["find_skill", "load_skill"]

# Keeps repo-local maintainer skills (frontmatter targets) out of the public skills/ tree. ~keep
[placement]
honor_targets = true

[lock]
include_outputs = false

[[includes]]
name = "public-core"
source = "modules/core"
include = ["skills", "rules", "context"]

[[includes]]
name = "public-cicd"
source = "modules/cicd"
include = ["skills"]

[[includes]]
name = "public-languages"
source = "modules/languages"
include = ["skills"]

[[includes]]
name = "public-bindings"
source = "modules/bindings"
include = ["skills"]

[[includes]]
name = "public-docs-sites"
source = "modules/docs-sites"
include = ["skills"]
