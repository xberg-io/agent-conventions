name = "public-skills"

[outputs.skills]
mode = "per_item_file"
dir = "skills"
filename = "{id}/SKILL.md"
resources = true
filter = "placement_core"

[outputs.skills.body]
sections = ["frontmatter", "content", "resource_index"]

[outputs.skills.frontmatter]
fields = ["description"]
name_first = true
quoted_fields = ["description"]
