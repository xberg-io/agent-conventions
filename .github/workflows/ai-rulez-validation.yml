name: AI-Rulez validation
on:
  push:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - "modules/**"
      - "actions/**"
      - "tools/**"
      - "plugin/**"
      - "skills/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - "scripts/sync*"
      - "mise.toml"
      - "poly.toml"
      - "poly-hooks.toml"
      - "mise.lock"
      - "mise.*.toml"
      - "mise.*.lock"
      - "toolchains.toml"
      - "poly.lock"
      - "poly-hooks.lock"
      - "mise-tasks/**"
      - "Cargo.toml"
      - "pyproject.toml"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/ai-rulez-validation.yml"
  pull_request:
    paths:
      - ".ai-rulez/**"
      - "modules/**"
      - "actions/**"
      - "tools/**"
      - "plugin/**"
      - "skills/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - "scripts/sync*"
      - "mise.toml"
      - "poly.toml"
      - "poly-hooks.toml"
      - "mise.lock"
      - "mise.*.toml"
      - "mise.*.lock"
      - "toolchains.toml"
      - "poly.lock"
      - "poly-hooks.lock"
      - "mise-tasks/**"
      - "Cargo.toml"
      - "pyproject.toml"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/ai-rulez-validation.yml"
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-ai-rulez@v1
      - uses: xberg-io/actions/validate-ai-rulez@v1
        with:
          expected-config-count: "8"
          additional-config-directories: |
            modules/core
            modules/cicd
            modules/languages
            modules/infrastructure
            modules/bindings
            modules/document-corpora
            modules/docs-sites
      - uses: ./actions/context-exposure
        with:
          repo-name: agent-conventions
  context-harness:
    runs-on: ubuntu-latest
    env:
      # uv must use the interpreter mise installed, not download its own. ~keep
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv github:Goldziher/poly
      # The context-exposure gate tests run the real ai-rulez when it is on PATH. ~keep
      - uses: xberg-io/actions/setup-ai-rulez@v1
      - name: Resolve the mise Python version
        id: python
        run: echo "version=$(python3 -c 'import platform; print(platform.python_version())')" >> "$GITHUB_OUTPUT"
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ steps.python.outputs.version }}-context-harness
      - name: Unit-test the context harness
        run: mise run context:test
      - name: Validate the eval cases
        run: mise run context:cases
  hook-runtime:
    name: Hook runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      UV_PYTHON_PREFERENCE: only-system
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-mise@v1
        with:
          install-args: python uv node github:Goldziher/poly
      - name: Qualify the optional hook producer
        env:
          UV_CACHE_DIR: ${{ runner.temp }}/uv-hook-tests
          CONVENTIONS_TEST_REPORTS_ROOT: ${{ runner.temp }}/conventions-hook-tests
        run: mise run context:hooks
