name: AI-Rulez validation
on:
  push:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - "modules/**"
      - "actions/**"
      - "tools/**"
      - "plugin/**"
      - "skills/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - "scripts/sync*"
      - "Cargo.toml"
      - "pyproject.toml"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/ai-rulez-validation.yml"
  pull_request:
    paths:
      - ".ai-rulez/**"
      - "modules/**"
      - "actions/**"
      - "tools/**"
      - "plugin/**"
      - "skills/**"
      - ".agents/plugins/**"
      - ".claude-plugin/**"
      - ".codex/**"
      - "scripts/sync*"
      - "Cargo.toml"
      - "pyproject.toml"
      - "package.json"
      - ".gitignore"
      - ".github/workflows/ai-rulez-validation.yml"
  workflow_call:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: xberg-io/actions/setup-ai-rulez@v1
        with:
          ai-rulez-version: "latest"
      - uses: xberg-io/actions/validate-ai-rulez@v1
        with:
          expected-config-count: "8"
          additional-config-directories: |
            modules/core
            modules/cicd
            modules/languages
            modules/infrastructure
            modules/bindings
            modules/document-corpora
            modules/docs-sites
      - uses: ./actions/context-exposure
        with:
          repo-name: agent-conventions
          budgets: |
            claude=4850
            codex=4000
  context-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Unit-test the context harness
        run: uv run --no-project --python 3.12 --with pyyaml==6.0.2 python -m unittest discover tools/context-evals
      - name: Validate the eval cases
        run: uv run --no-project --python 3.12 --with pyyaml==6.0.2 python tools/context-evals/harness.py validate-cases
