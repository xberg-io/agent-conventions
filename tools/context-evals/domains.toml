# Organisation taxonomy for the context harness (issue #3, section 5.1).
#
# [domain.<name>]: one domain per product repo plus cross-cutting domains. `terms` are words that
# identify the domain; an always-visible artifact in a repo that does not own the domain must not use
# them. [repos.<name>].domains lists the domains a consumer owns. [[accept]] records a reasoned
# exception: every entry needs a `reason`. `names` lists hyphenated compounds that are names in their
# own right, so a term inside one is not counted (`xberg` in `xberg-io`); every domain term is such a
# name already. A term inside any other compound (`alef-generated`) is a hit.

names = ["xberg-io", "xberg-brand-and-docs"]

[domain.xberg]
owner = "@xberg-io/xberg"
paths = ["xberg/"]
terms = ["xberg", "extraction benchmark", "ground truth", "OCR", "Pdfium", "hOCR"]

[domain.document-corpora]
# Design-partner and public-record document corpora: the opt-in modules/document-corpora module.
owner = "@xberg-io/xberg"
paths = ["test_documents/"]
terms = ["partner corpus", "partner-corpus", "test_documents", "design-partner"]

[domain.crawlberg]
owner = "@xberg-io/crawlberg"
paths = ["crawlberg/"]
terms = ["crawlberg", "crawler", "web_crawl"]

[domain.html-to-markdown]
owner = "@xberg-io/html-to-markdown"
paths = ["html-to-markdown/"]
terms = ["html-to-markdown"]

[domain.liter-llm]
owner = "@xberg-io/liter-llm"
paths = ["liter-llm/"]
terms = ["liter-llm"]

[domain.tree-sitter-language-pack]
owner = "@xberg-io/tree-sitter-language-pack"
paths = ["tree-sitter-language-pack/"]
terms = ["tree-sitter-language-pack"]

[domain.sceptre]
owner = "@xberg-io/sceptre"
paths = ["sceptre/"]
terms = ["sceptre"]

[domain.enterprise]
owner = "@xberg-io/xberg-enterprise"
paths = ["xberg-enterprise/"]
terms = ["xberg-enterprise", "OTLP", "Helm", "ArgoCD", "Mimir"]

[domain.bindings]
# Polyglot binding generation: owned by repos that generate language bindings with alef.
owner = "@xberg-io/alef"
paths = ["alef/", "packages/", "crates/*-ffi/", "crates/*-py/", "crates/*-node/"]
terms = ["alef", "PyO3", "napi-rs", "Magnus", "Rustler", "ext-php-rs", "cbindgen", "jni-rs", "extendr"]

[domain.e2e-generator]
owner = "@xberg-io/alef"
paths = ["tools/e2e-generator/", "fixtures/"]
terms = ["e2e fixture", "e2e-generator"]

[domain.infrastructure]
owner = "@xberg-io/infra"
paths = ["deploy/", "charts/", "Dockerfile"]
terms = ["gcloud", "Kubernetes", "K8s", "Prometheus"]

[repos.xberg]
domains = ["xberg", "bindings", "e2e-generator", "infrastructure", "document-corpora"]

[repos.crawlberg]
domains = ["crawlberg", "bindings", "e2e-generator"]

[repos.html-to-markdown]
domains = ["html-to-markdown", "bindings", "e2e-generator", "infrastructure"]

[repos.liter-llm]
domains = ["liter-llm", "bindings", "e2e-generator"]

[repos.tree-sitter-language-pack]
domains = ["tree-sitter-language-pack", "bindings", "e2e-generator"]

[repos.sceptre]
domains = ["sceptre"]

[repos.xberg-enterprise]
domains = ["enterprise", "infrastructure", "xberg", "document-corpora"]

[repos.alef]
domains = ["bindings", "e2e-generator"]

[repos.ai-rulez]
domains = []

[repos.agent-conventions]
domains = []

# The polyrepo root orchestrates every subrepo but owns no product knowledge.
[repos.xberg-io]
domains = []

# The tap and the bucket distribute every product's CLI; formula and manifest names are not product knowledge.
[repos.homebrew-tap]
domains = []

[repos.python-wheels]
domains = []

[repos."xberg-io.r-universe.dev"]
domains = []

[repos.toolchains]
domains = []

[repos.scoop-bucket]
domains = []

# Shared brand assets and the docs theme serve every product site but own no product knowledge.
[repos.assets]
domains = []

[repos.docs-theme]
domains = []

# Company documents (pitch, product plans, market research) describe the commercial product.
[repos.internal-docs]
domains = ["xberg", "enterprise", "document-corpora"]

[repos.infra]
domains = ["infrastructure", "enterprise"]

[repos.infra-release-runners]
domains = ["infrastructure"]

[repos.paddle-to-onnx]
domains = []

[repos.test_documents]
domains = ["xberg", "document-corpora"]

[repos.actions]
domains = ["bindings", "infrastructure"]

[repos.sdks]
domains = ["xberg", "enterprise"]

[repos.test-apps]
domains = ["xberg", "enterprise", "document-corpora"]

# The org name and the brand skill legitimately say "xberg" (xberg-io, xberg.io) everywhere; the
# leak check targets product knowledge, so the org prefix is accepted in the brand skill only.
[[accept]]
term = "xberg"
artifact = "skill:xberg-brand-and-docs"
reason = "Org-wide brand skill: the name is the routing key, not product knowledge."

# sceptre is an OCR engine: "OCR" in its own rules is its domain, not xberg's.
[[accept]]
term = "OCR"
repo = "sceptre"
reason = "sceptre's own subject; the term is shared with xberg's OCR work."

# paddle-to-onnx converts OCR models; "OCR" is its subject, as for sceptre.
[[accept]]
term = "OCR"
repo = "paddle-to-onnx"
reason = "paddle-to-onnx's own subject; the term is shared with xberg's OCR work."
