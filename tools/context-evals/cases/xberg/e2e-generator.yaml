# Seed cases for the e2e-generator domain in the xberg repository: JSON fixtures, alef e2e generation and
# the generated e2e/ suites.

- id: xberg-e2e-add-fixture
  domain: e2e-generator
  repo: xberg
  cwd: fixtures
  persona: contributor
  prompt: "I want a cross-language test that extracting an empty PDF byte buffer returns an error. Where does it go and how do I get it into every binding's suite?"
  behaviour: answer
  must_use: [e2e-generation]
  expect: ["alef e2e generate"]
  criteria:
    - id: fixture-json
      check: "The answer says to add a JSON fixture with a unique snake_case id under fixtures/ in the matching category directory (for example fixtures/extract or fixtures/error)."
    - id: regen
      check: "The answer says to run alef e2e generate and then the language suites (alef test --e2e --lang <lang> or mise run <lang>:e2e), committing the fixture with the regenerated output."
  reference:
    facts:
      - >-
        Add a JSON fixture under the matching fixtures/ category, for example fixtures/error/ for the
        empty-PDF-buffer error case, with a unique snake_case id and the appropriate category, extract
        call/input and expected error; fixtures/extract/extract_bytes_input.json illustrates the fixture
        structure.
      - >-
        Run alef e2e generate, then the relevant language suites with alef test --e2e --lang <lang> or mise run
        <lang>:e2e; Commit the source fixture together with the regenerated e2e output; do not hand-edit each
        binding suite.
    sources: [fixtures/extract/extract_bytes_input.json, fixtures/error, mise-tasks/e2e.toml]
  sandbox: result

- id: xberg-e2e-config-table
  domain: e2e-generator
  repo: xberg
  cwd: .
  prompt: "Which alef.toml table configures e2e generation in xberg, and where do I add a language to it?"
  behaviour: answer
  must_use: [alef-generated-bindings]
  expect: ['\[crates\.e2e\]']
  criteria:
    - id: crates-e2e
      check: 'The answer says e2e generation is configured under [crates.e2e] (fixtures = "fixtures", output = "e2e"), not a top-level [e2e] table.'
    - id: languages
      check: "The answer says languages are listed in the languages array of [crates.e2e], with per-language call overrides under [crates.e2e.call.overrides.<lang>]."
  reference:
    facts:
      - >-
        Configure e2e generation under [crates.e2e] in alef.toml, with fixtures = "fixtures" and output = "e2e";
        it is not a top-level [e2e] table.
      - >-
        Add the language to [crates.e2e]'s languages array, with language-specific call overrides in
        [crates.e2e.call.overrides.<lang>].
    sources: [alef.toml]
  sandbox: result

- id: xberg-e2e-no-generator-dir
  domain: e2e-generator
  repo: xberg
  cwd: .
  prompt: "Where is the e2e generator source in this repo? The generated Go assertions compare floats with == and I want to fix the template."
  behaviour: answer
  must_use: [crate-structure]
  expect: ["(?i)alef"]
  criteria:
    - id: not-here
      check: "The answer says there is no tools/e2e-generator in xberg; generation is alef e2e generate, so the template fix belongs in the alef repository."
  reference:
    facts:
      - >-
        There is no tools/e2e-generator implementation in Xberg; The suites are generated by alef e2e generate,
        so fix a generated Go assertion/template defect in the Alef repository, release/pin that fix and
        regenerate the consumer rather than editing generated Go assertions.
    sources: [tools, mise-tasks/e2e.toml]
  sandbox: result

- id: xberg-e2e-edit-generated-test
  domain: e2e-generator
  repo: xberg
  cwd: e2e/python
  prompt: "test_batch.py has a wrong expected value. I'll just correct the assertion in e2e/python/tests/test_batch.py, fine?"
  behaviour: answer
  must_not_mention: ["(?i)tools/e2e-generator"]
  criteria:
    - id: generated
      check: "The answer says the file is generated by alef and must not be edited; fix the fixture under fixtures/ (or alef.toml) and regenerate."
  reference:
    facts:
      - >-
        Do not correct the assertion directly in e2e/python/tests/test_batch.py: its header identifies it as
        Alef-generated, and regeneration would overwrite that edit; Fix the source fixture under fixtures/batch/
        (or the relevant alef.toml configuration), then run alef e2e generate and commit the regenerated output.
    sources: [e2e/python/tests/test_batch.py, fixtures/batch]
  sandbox: result

- id: xberg-e2e-verify-freshness
  domain: e2e-generator
  repo: xberg
  cwd: e2e
  prompt: "How does CI check that the committed e2e suites match the fixtures?"
  behaviour: answer
  expect: ["e2e:verify"]
  criteria:
    - id: verify-task
      check: "The answer says mise run e2e:verify regenerates with alef e2e generate --strict and fails on git diff --exit-code e2e/."
  reference:
    facts:
      - >-
        CI freshness is checked with mise run e2e:verify; mise-tasks/e2e.toml first prepares the Dart formatting
        context, runs alef e2e generate --strict, then git diff --exit-code e2e/; any resulting committed-suite
        drift fails the check.
    sources: [mise-tasks/e2e.toml]
  sandbox: result

- id: xberg-e2e-single-language
  domain: e2e-generator
  repo: xberg
  cwd: .
  prompt: "I only changed the Ruby binding. How do I run just the Ruby e2e suite?"
  behaviour: answer
  expect: ["ruby:e2e|alef test --e2e --lang ruby"]
  criteria:
    - id: lang-task
      check: "The answer gives mise run ruby:e2e (or alef test --e2e --lang ruby)."
  reference:
    facts:
      - >-
        Run mise run ruby:e2e, which invokes alef test --e2e --lang ruby; This runs just the Ruby e2e suite;
        there is no generic e2e:lang task in mise-tasks/e2e.toml.
    sources: [mise-tasks/e2e.toml]
  sandbox: result
