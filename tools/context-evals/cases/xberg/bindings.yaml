# Seed cases for the bindings domain in the xberg repository: alef-generated bindings, the FFI bridge and
# alef's installed `alef` skill.

- id: xberg-bindings-extractor-alef-skip
  domain: bindings
  repo: xberg
  cwd: crates/xberg/src/extractors
  persona: contributor
  prompt: >-
    I added a DjvuExtractor struct and now `alef generate` dies and nothing in packages/ regenerates. The impl
    block has #[cfg_attr(alef, alef(skip))] already. What's wrong?
  behaviour: answer
  must_use: [alef-generated-bindings]
  expect: ['alef\(skip\)']
  criteria:
    - id: on-struct
      check: "The answer says the attribute must be on the struct declaration, not the impl block."
    - id: global-abort
      check: "The answer says a missing skip aborts the whole regen, leaving the tree stale."
  reference:
    facts:
      - >-
        Put #[cfg_attr(alef, alef(skip))] on the DjvuExtractor struct declaration, not merely its impl block;
        OdtExtractor in crates/xberg/src/extractors/odt.rs shows the required placement.
      - >-
        A missing struct-level skip can abort Alef regeneration globally, leaving packages/ and the other
        generated bindings stale; fix the core struct annotation before regenerating.
    sources: [crates/xberg/src/extractors/odt.rs, alef.toml]
  sandbox: result

- id: xberg-bindings-non-exhaustive-e0639
  domain: bindings
  repo: xberg
  cwd: crates/xberg-py
  prompt: "After I marked ChunkingConfig #[non_exhaustive] for forward compatibility, the binding crates fail with E0639. How do I keep forward compatibility?"
  behaviour: answer
  must_use: [alef-generated-bindings]
  expect: ["(?i)Default"]
  criteria:
    - id: struct-literal
      check: "The answer says generated From impls build the core type with a struct literal, which #[non_exhaustive] forbids across crates."
    - id: derive-default
      check: "The answer says to remove #[non_exhaustive] from binding-facing ChunkingConfig and retain its existing Default implementation rather than adding a conflicting derive, keeping #[non_exhaustive] only on types in [crates.exclude]."
  reference:
    facts:
      - >-
        Generated From impls construct the core type using a struct literal across crate boundaries;
        #[non_exhaustive] forbids that external construction and causes E0639 in generated binding crates.
      - >-
        Remove #[non_exhaustive] from the binding-facing ChunkingConfig and retain its existing manual Default
        implementation (1000 max characters and 200 overlap), rather than adding a conflicting derive(Default);
        For binding-facing types without a Default implementation, provide or derive one; reserve
        #[non_exhaustive] for types excluded in [crates.exclude].
    sources: [alef.toml, crates/xberg/src/core/config/processing.rs]
  sandbox: result

- id: xberg-bindings-java-panama
  domain: bindings
  repo: xberg
  cwd: packages/java
  prompt: "The Java package crashes in native code. Should I debug crates/xberg-jni?"
  behaviour: answer
  expect: ["(?i)panama", "xberg-ffi"]
  criteria:
    - id: panama
      check: 'The answer says the Java package uses Panama FFM over xberg-ffi (ffi_style = "panama"), not xberg-jni.'
    - id: jni-owner
      check: "The answer says xberg-jni backs packages/kotlin-android."
  reference:
    facts:
      - >-
        The Java package uses Panama FFM over xberg-ffi: alef.toml [crates.java] sets ffi_style = "panama";
        Debug that FFI/native path for packages/java rather than assuming it uses xberg-jni.
      - >-
        xberg-jni backs packages/kotlin-android; it is the Kotlin Android JNI bridge, separate from the Panama
        Java package.
    sources: [alef.toml, crates/xberg-jni]
  sandbox: result

- id: xberg-bindings-handfix-generated
  domain: bindings
  repo: xberg
  cwd: crates/xberg-py
  prompt: "There's a typo in a docstring in crates/xberg-py/src/lib.rs. Can I just fix it there?"
  behaviour: answer
  must_use: [alef]
  expect: ["alef:verify|alef verify"]
  criteria:
    - id: generated
      check: "The answer says lib.rs is Alef-generated and a regen would restore the typo."
    - id: fix-source
      check: "The answer says to fix the Rust doc comment (or alef.toml) and regenerate with alef generate (or alef all)."
  reference:
    facts:
      - >-
        Do not edit crates/xberg-py/src/lib.rs by hand: it is Alef-generated, and regeneration would restore the
        typo.
      - >-
        Fix the originating Rust doc comment or alef.toml configuration, then regenerate with alef generate or
        alef all; Run mise run alef:verify (alef verify --exit-code) afterward to check freshness; there is no
        alef:generate task.
    sources: [crates/xberg-py/src/lib.rs, mise.toml]
  sandbox: result

- id: xberg-bindings-no-alef-format
  domain: bindings
  repo: xberg
  cwd: packages
  prompt: "After regenerating, how do I format the generated binding code? Is there a mise task alef:format?"
  behaviour: answer
  must_use: [alef]
  expect: ["(?i)poly"]
  criteria:
    - id: poly
      check: "The answer says there is no alef:format task and formatting is done by poly (mise run format or poly fmt --fix .)."
  reference:
    facts:
      - >-
        There is no mise task alef:format; Format generated bindings with Poly through mise run format or poly
        fmt --fix .; the Alef workflow also formats via Poly during regeneration.
    sources: [mise.toml]
  sandbox: result

- id: xberg-bindings-freshness-scope
  domain: bindings
  repo: xberg
  cwd: .
  prompt: "To check generated bindings are fresh in CI, is `git diff --exit-code packages/` after a regen enough?"
  behaviour: answer
  must_use: [alef-generated-bindings]
  expect: ["alef:verify|alef verify"]
  criteria:
    - id: under-scoped
      check: "The answer says packages/ is under-scoped because generated output also lands in crates/xberg-py, crates/xberg-ffi and other binding crates and e2e/."
    - id: use-verify
      check: "The answer recommends mise run alef:verify."
  reference:
    facts: ["Generated files such as crates/xberg-py/src/lib.rs and e2e/ live outside packages/."]
    sources: [mise.toml, crates/xberg-py/src/lib.rs, e2e]
  sandbox: result

- id: xberg-bindings-ffi-trait-default
  domain: bindings
  repo: xberg
  cwd: crates/xberg-ffi
  persona: maintainer
  prompt: >-
    I added `fn supported_scripts(&self) -> ScriptSet` to the OcrBackend trait. What does ScriptSet need so the
    generated FFI bridge compiles and behaves?
  behaviour: answer
  must_use: [alef-generated-bindings]
  expect: ["Default", "Serialize", "Deserialize"]
  criteria:
    - id: json
      check: "The answer says the generated bridge marshals every trait return through JSON (serde_json::from_str), so ScriptSet needs Default + Serialize + Deserialize."
    - id: default-fallback
      check: "The answer says a failed or missing host callback falls back to Default::default()."
  reference:
    facts:
      - >-
        Generated trait return values cross the FFI bridge through JSON decoding with serde_json::from_str; The
        new supported_scripts return type ScriptSet therefore needs Default + Serialize + Deserialize, including
        when it is a unit-only enum.
      - >-
        For such a non-Result return, XbergOcrBackendBridge returns Default::default() when the host callback
        slot is missing, fails, returns null or supplies invalid JSON, as its existing backend_type and related
        methods demonstrate.
    sources: [crates/xberg-ffi/src/lib.rs, crates/xberg/src/plugins/ocr.rs]
  sandbox: result

- id: xberg-bindings-python-plugin-exception
  domain: bindings
  repo: xberg
  cwd: crates/xberg-py
  prompt: "A Python extractor plugin raises ValueError. Will xberg fall back to the built-in extractor, and will I see the Python traceback?"
  behaviour: answer
  must_use: [plugin-architecture-patterns]
  expect: ["(?i)Other"]
  criteria:
    - id: other
      check: "The answer says host exceptions become XbergError::Other with plugin and method context, and the traceback is not retained."
    - id: not-plugin
      check: "The answer says not to assume Python bridge errors are fallback-eligible the way XbergError::Plugin is."
  reference:
    facts: ["is_extractor_fallback_eligible accepts only UnsupportedFormat and Plugin."]
    sources: [crates/xberg-py/src/lib.rs, crates/xberg/src/core/extractor/file.rs]
  sandbox: result

- id: xberg-bindings-generator-bug-owner
  domain: bindings
  repo: xberg
  cwd: packages/go
  prompt: "The generated Go binding drops an Option<u32> field. Should I patch packages/go or fix it somewhere else?"
  behaviour: answer
  must_use: [polyrepo-boundaries]
  expect: ["(?i)alef"]
  criteria:
    - id: alef-owns
      check: "The answer says generator defects are fixed in the alef repository, working around them in xberg only when necessary."
    - id: order
      check: "The answer says the fix ships upstream, alef is released and the pinned version bumped, then xberg regenerates."
  reference:
    facts:
      - >-
        Ship the fix upstream, release Alef, bump the consumer's pinned Alef version, and only then regenerate
        Xberg with that released tool; A locally modified sibling Alef checkout does not make the pinned
        consumer reproducible.
      - >-
        Fix the reusable Option<u32> generation defect in the Alef repository; packages/go is generated output,
        so work around it in Xberg only when necessary rather than treating the consumer as the generator owner.
    sources:
      [alef.toml, .ai-rulez/skills/polyrepo-boundaries/SKILL.md, .ai-rulez/skills/alef-generated-bindings/SKILL.md]
  sandbox: result

- id: xberg-bindings-neg-release-not-enterprise
  domain: bindings
  repo: xberg
  cwd: packages/python
  prompt: "How is the Python package's version kept in sync with the Rust core for a release?"
  behaviour: answer
  must_not_mention: ["(?i)ArgoCD", "(?i)xberg-enterprise", "(?i)Mimir"]
  expect: ["(?i)sync-versions|version:sync"]
  criteria:
    - id: alef-sync
      check: "The answer says alef sync-versions (via mise run version:sync) writes the binding manifest versions from the root Cargo.toml."
    - id: no-hand-edit
      check: "The answer says not to hand-edit the package version."
  reference:
    facts:
      - >-
        Run mise run version:sync: it invokes alef sync-versions to propagate the root Cargo.toml version to the
        Alef-managed binding manifests, including the Python package, with extra paths configured by
        [workspace.sync] in alef.toml.
      - >-
        Do not hand-edit the Python package version; use the version synchronization task so the binding
        manifest remains aligned with the Rust core.
    sources: [alef.toml, mise.toml]
  sandbox: result

- id: xberg-bindings-ask-broken
  domain: bindings
  repo: xberg
  cwd: .
  prompt: "The bindings are broken after my last change."
  behaviour: ask
  criteria:
    - id: which-binding
      check: "The answer asks which binding or language and what failure (build error, test failure, stale generated output) before changing anything."
  reference:
    facts:
      - >-
        Which binding/language is broken and what exact compilation error, e2e failure or generated-output
        freshness diff do you see, including the failing command?
    sources: [alef.toml, packages]
  sandbox: result
