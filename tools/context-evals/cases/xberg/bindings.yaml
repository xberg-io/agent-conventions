# Seed cases for the bindings domain in the xberg repository: alef-generated bindings, the FFI bridge and
# alef's installed `alef` skill.

- id: xberg-bindings-extractor-alef-skip
  domain: bindings
  repo: xberg
  cwd: crates/xberg/src/extractors
  persona: contributor
  prompt: >-
    I added a DjvuExtractor struct and now `task alef:generate` dies and nothing in packages/ regenerates. The impl
    block has #[cfg_attr(alef, alef(skip))] already. What's wrong?
  behaviour: answer
  must_use: [alef-generated-bindings]
  expect: ['alef\(skip\)']
  criteria:
    - id: on-struct
      check: "The answer says the attribute must be on the struct declaration, not the impl block."
    - id: global-abort
      check: "The answer says a missing skip aborts the whole regen, leaving the tree stale."
  reference:
    facts: ["Extractor structs in crates/xberg/src/extractors carry #[cfg_attr(alef, alef(skip))] on the struct, e.g. odt.rs."]
    sources: [crates/xberg/src/extractors/odt.rs, alef.toml]
  sandbox: result

- id: xberg-bindings-non-exhaustive-e0639
  domain: bindings
  repo: xberg
  cwd: crates/xberg-py
  prompt: "After I marked ChunkingConfig #[non_exhaustive] for forward compatibility, the binding crates fail with E0639. How do I keep forward compatibility?"
  behaviour: answer
  must_use: [alef-generated-bindings]
  expect: ['(?i)Default']
  criteria:
    - id: struct-literal
      check: "The answer says generated From impls build the core type with a struct literal, which #[non_exhaustive] forbids across crates."
    - id: derive-default
      check: "The answer says to drop #[non_exhaustive] and derive Default instead, keeping #[non_exhaustive] only on types in [crates.exclude]."
  reference:
    facts: ["alef.toml has a [crates.exclude] table; ChunkingConfig is binding-facing."]
    sources: [alef.toml, crates/xberg/src/core/config/processing.rs]
  sandbox: result

- id: xberg-bindings-java-panama
  domain: bindings
  repo: xberg
  cwd: packages/java
  prompt: "The Java package crashes in native code. Should I debug crates/xberg-jni?"
  behaviour: answer
  expect: ['(?i)panama', 'xberg-ffi']
  criteria:
    - id: panama
      check: "The answer says the Java package uses Panama FFM over xberg-ffi (ffi_style = \"panama\"), not xberg-jni."
    - id: jni-owner
      check: "The answer says xberg-jni backs packages/kotlin-android."
  reference:
    facts: ["alef.toml [crates.java] sets ffi_style = \"panama\"."]
    sources: [alef.toml, crates/xberg-jni]
  sandbox: result

- id: xberg-bindings-handfix-generated
  domain: bindings
  repo: xberg
  cwd: crates/xberg-py
  prompt: "There's a typo in a docstring in crates/xberg-py/src/lib.rs. Can I just fix it there?"
  behaviour: answer
  must_use: [alef]
  expect: ['alef:verify|alef verify']
  criteria:
    - id: generated
      check: "The answer says lib.rs is Alef-generated and a regen would restore the typo."
    - id: fix-source
      check: "The answer says to fix the Rust doc comment (or alef.toml) and regenerate with task alef:generate."
  reference:
    facts: ["task alef:verify runs alef verify --exit-code; task alef:generate runs alef all --clean."]
    sources: [crates/xberg-py/src/lib.rs, Taskfile.yml]
  sandbox: result

- id: xberg-bindings-no-alef-format
  domain: bindings
  repo: xberg
  cwd: packages
  prompt: "After regenerating, how do I format the generated binding code? Is there a task alef:format?"
  behaviour: answer
  must_use: [alef]
  expect: ['(?i)poly']
  criteria:
    - id: poly
      check: "The answer says there is no alef:format task and formatting is done by poly (task format or poly fmt --fix .)."
  reference:
    facts: ["Taskfile.yml alef namespace has generate, verify, build, sync, docs and verify:* tasks; no alef:format."]
    sources: [Taskfile.yml]
  sandbox: result

- id: xberg-bindings-freshness-scope
  domain: bindings
  repo: xberg
  cwd: .
  prompt: "To check generated bindings are fresh in CI, is `git diff --exit-code packages/` after a regen enough?"
  behaviour: answer
  must_use: [alef-generated-bindings]
  expect: ['alef:verify|alef verify']
  criteria:
    - id: under-scoped
      check: "The answer says packages/ is under-scoped because generated output also lands in crates/xberg-py, crates/xberg-ffi and other binding crates and e2e/."
    - id: use-verify
      check: "The answer recommends task alef:verify."
  reference:
    facts: ["Generated files such as crates/xberg-py/src/lib.rs and e2e/ live outside packages/."]
    sources: [Taskfile.yml, crates/xberg-py/src/lib.rs, e2e]
  sandbox: result

- id: xberg-bindings-ffi-trait-default
  domain: bindings
  repo: xberg
  cwd: crates/xberg-ffi
  persona: maintainer
  prompt: >-
    I added `fn supported_scripts(&self) -> ScriptSet` to the OcrBackend trait. What does ScriptSet need so the
    generated FFI bridge compiles and behaves?
  behaviour: answer
  must_use: [alef-generated-bindings]
  expect: ['Default', 'Serialize', 'Deserialize']
  criteria:
    - id: json
      check: "The answer says the generated bridge marshals every trait return through JSON (serde_json::from_str), so ScriptSet needs Default + Serialize + Deserialize."
    - id: default-fallback
      check: "The answer says a failed or missing host callback falls back to Default::default()."
  reference:
    facts: ["crates/xberg-ffi/src/lib.rs defines XbergOcrBackendBridge and deserializes returns with serde_json::from_str::<xberg::...>."]
    sources: [crates/xberg-ffi/src/lib.rs, crates/xberg/src/plugins/ocr.rs]
  sandbox: result

- id: xberg-bindings-python-plugin-exception
  domain: bindings
  repo: xberg
  cwd: crates/xberg-py
  prompt: "A Python extractor plugin raises ValueError. Will xberg fall back to the built-in extractor, and will I see the Python traceback?"
  behaviour: answer
  must_use: [plugin-architecture-patterns]
  expect: ['(?i)Other']
  criteria:
    - id: other
      check: "The answer says host exceptions become XbergError::Other with plugin and method context, and the traceback is not retained."
    - id: not-plugin
      check: "The answer says not to assume Python bridge errors are fallback-eligible the way XbergError::Plugin is."
  reference:
    facts: ["is_extractor_fallback_eligible accepts only UnsupportedFormat and Plugin."]
    sources: [crates/xberg-py/src/lib.rs, crates/xberg/src/core/extractor/file.rs]
  sandbox: result

- id: xberg-bindings-generator-bug-owner
  domain: bindings
  repo: xberg
  cwd: packages/go
  prompt: "The generated Go binding drops an Option<u32> field. Should I patch packages/go or fix it somewhere else?"
  behaviour: answer
  must_use: [polyrepo-boundaries]
  expect: ['(?i)alef']
  criteria:
    - id: alef-owns
      check: "The answer says generator defects are fixed in the alef repository, working around them in xberg only when necessary."
    - id: order
      check: "The answer says the fix ships upstream, alef is released and the pinned version bumped, then xberg regenerates."
  reference:
    facts: ["packages/go is generated from alef.toml [crates.go]."]
    sources: [alef.toml, .ai-rulez/skills/polyrepo-boundaries/SKILL.md, .ai-rulez/skills/alef-generated-bindings/SKILL.md]
  sandbox: result

- id: xberg-bindings-neg-release-not-enterprise
  domain: bindings
  repo: xberg
  cwd: packages/python
  prompt: "How is the Python package's version kept in sync with the Rust core for a release?"
  behaviour: answer
  must_not_mention: ['(?i)ArgoCD', '(?i)xberg-enterprise', '(?i)Mimir']
  expect: ['(?i)sync-versions|version:sync']
  criteria:
    - id: alef-sync
      check: "The answer says alef sync-versions (via task version:sync) writes the binding manifest versions from the root Cargo.toml."
    - id: no-hand-edit
      check: "The answer says not to hand-edit the package version."
  reference:
    facts: ["alef.toml [workspace.sync] lists the extra paths synced; version:sync runs alef sync-versions first."]
    sources: [alef.toml, .task/tools/version-sync.yml]
  sandbox: result

- id: xberg-bindings-ask-broken
  domain: bindings
  repo: xberg
  cwd: .
  prompt: "The bindings are broken after my last change."
  behaviour: ask
  criteria:
    - id: which-binding
      check: "The answer asks which binding or language and what failure (build error, test failure, stale generated output) before changing anything."
  reference:
    facts: ["xberg generates bindings for Python, Node, Ruby, PHP, Elixir, WASM, Go, Java, C#, Dart, Kotlin Android, Swift, Zig and the C FFI from alef.toml."]
    sources: [alef.toml, packages]
  sandbox: result
