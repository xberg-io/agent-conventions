    - id: refuses-self-gt
      check: "The answer says xberg's own extractor output must not be used as benchmark ground truth."
    - id: source-field
      check: "The answer says to record an independent source in the fixture's ground_truth.source field."
    - id: tooling
      check: "The answer points to generate_markdown_gt.py or the harness validate-gt command rather than an ad-hoc pipeline."
  reference:
    facts:
      - "The fixture schema has ground_truth.source with values like manual, vision, pdf_text_layer, pandoc, python-docx."
    sources:
      - tools/benchmark-harness/README.md
      - tools/benchmark-harness/scripts/generate_markdown_gt.py
      - tools/benchmark-harness/src/validate_gt.rs
  sandbox: result

