- id: xberg-test-corpus-worktree-control
  domain: xberg
  repo: xberg
  cwd: crates/xberg
  persona: maintainer
  prompt: >-
    I made a git worktree at the base commit as an A/B control, ran cargo test there, and everything passed in 0.00s.
    So my change is what broke the HEIC tests?
  behaviour: answer
  must_use: [test-corpus]
  expect: ["(?i)submodule|test_documents"]
  criteria:
    - id: vacuous
      check: "The answer says the worktree has an empty test_documents submodule, so fixture tests skipped and the control is vacuous."
    - id: fix
      check: "The answer gives a fix: symlink the main tree's test_documents into the worktree, or use a separate CARGO_TARGET_DIR in the main checkout."
  reference:
    facts:
      - >-
        A new git worktree does not populate the test_documents submodule; If its fixtures are absent,
        read_test_fixture prints SKIP and returns None, so an apparently passing fixture suite can be a vacuous
        control.
      - >-
        Make the corpus available in the control worktree, for example by symlinking the main checkout's
        populated test_documents directory, or run the control in the main checkout with its own
        CARGO_TARGET_DIR; Confirm the fixture-dependent tests actually execute.
    sources: [.gitmodules, crates/xberg/src/utils/mod.rs]
  sandbox: result

- id: xberg-test-corpus-no-include-bytes
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/extraction
  prompt: 'In a unit test for the HEIC path, can I just `include_bytes!("../../../../test_documents/images/test.heic")`?'
  behaviour: answer
  must_use: [test-corpus]
  expect: ["read_test_fixture"]
  criteria:
    - id: no-include
      check: "The answer says not to include_bytes! a test_documents fixture because a missing fixture becomes a build failure."
    - id: helper
      check: "The answer recommends crate::utils::read_test_fixture and returning early on None."
  reference:
    facts:
      - >-
        Do not use include_bytes! for a test_documents fixture: an unpopulated submodule would then cause a
        compile-time build failure.
      - >-
        In a crate unit test use crate::utils::read_test_fixture, which returns Option<Vec<u8>>, and return
        early on None; The helper reports the unavailable fixture and fetch instruction instead of making a
        missing corpus a build failure.
    sources: [crates/xberg/src/utils/mod.rs]
  sandbox: result

