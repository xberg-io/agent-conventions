- id: xberg-test-corpus-worktree-control
  domain: xberg
  repo: xberg
  cwd: crates/xberg
  persona: maintainer
  prompt: >-
    I made a git worktree at the base commit as an A/B control, ran cargo test there, and everything passed in 0.00s.
    So my change is what broke the HEIC tests?
  behaviour: answer
  must_use: [test-corpus]
  expect: ["(?i)submodule|test_documents"]
  criteria:
    - id: vacuous
      check: "The answer says the worktree has an empty test_documents submodule, so fixture tests skipped and the control is vacuous."
    - id: fix
      check: "The answer gives a fix: symlink the main tree's test_documents into the worktree, or use a separate CARGO_TARGET_DIR in the main checkout."
  reference:
    facts:
      - "test_documents is a submodule (.gitmodules)."
      - "read_test_fixture prints SKIP: fixture ... not available and returns None when the file is absent."
    sources: [.gitmodules, crates/xberg/src/utils/mod.rs]
  sandbox: result

