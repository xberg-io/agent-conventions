# Seed cases for the xberg product domain in the xberg repository (issue #3, section 5.2).
# One positive case per repo-owned skill and path-scoped rule, cross-domain negatives and a behaviour sweep.

# --- skills -------------------------------------------------------------------------------------

- id: xberg-pipeline-fallback-parsing-error
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/core
  persona: maintainer
  prompt: >-
    A corrupt DOCX fails in DocxExtractor with a Parsing error, and I expected the registry to fall back to the next
    extractor for that MIME type. It never does. Is the fallback broken?
  behaviour: answer
  must_use: [extraction-pipeline-patterns]
  expect: ["(?i)UnsupportedFormat", "(?i)Plugin"]
  criteria:
    - id: not-a-bug
      check: "The answer says the fallback did not run by design, not because of a bug."
    - id: eligible-errors
      check: "The answer states that only UnsupportedFormat and Plugin errors are fallback-eligible."
    - id: names-predicate
      check: "The answer names is_extractor_fallback_eligible or core/extractor/file.rs as where this is decided."
  reference:
    facts:
      - "is_extractor_fallback_eligible matches only XbergError::UnsupportedFormat and XbergError::Plugin."
      - "Parsing, Io, Ocr and Validation errors abort the extractor chain."
    sources: [crates/xberg/src/core/extractor/file.rs]
  sandbox: result

- id: xberg-pipeline-cache-docker-build-id
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/cache
  persona: maintainer
  prompt: >-
    I changed extractor output behaviour. Do I need to bump CACHE_SCHEMA_VERSION, or does the extraction cache key
    already separate builds from different commits?
  behaviour: answer
  must_use: [extraction-pipeline-patterns]
  expect: ["XBERG_BUILD_ID"]
  criteria:
    - id: build-id-in-key
      check: "The answer says the cache version tag includes XBERG_BUILD_ID, so builds from different commits get different entries."
    - id: empty-build-id
      check: "The answer says builds without git metadata (Docker builds or crates.io tarballs) get an empty XBERG_BUILD_ID, which is when a CACHE_SCHEMA_VERSION bump is needed."
  reference:
    facts:
      - "cache/version.rs folds CACHE_SCHEMA_VERSION and XBERG_BUILD_ID into the cache version tag."
      - "build.rs emits XBERG_BUILD_ID; .dockerignore excludes **/.git/, so Docker builds have no git metadata."
    sources: [crates/xberg/src/cache/version.rs, crates/xberg/build.rs, .dockerignore]
  sandbox: result

- id: xberg-mcp-new-tool-contract
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/mcp
  persona: contributor
  prompt: "I'm adding a `summarize` tool to the MCP server. Which test pins the tool set, and how many tools does it list today?"
  behaviour: answer
  must_use: [api-server-mcp]
  expect: ["test_all_tools_are_registered", '\b9\b|nine']
  criteria:
    - id: names-test
      check: "The answer names test_all_tools_are_registered in mcp/server.rs and says to extend it."
    - id: count
      check: "The answer says the test currently lists nine tools."
  reference:
    facts:
      - "test_all_tools_are_registered in mcp/server.rs lists extract, extract_batch, detect_mime_type, list_formats, cache_stats, cache_clear, get_version, cache_manifest, cache_warm."
    sources: [crates/xberg/src/mcp/server.rs]
  sandbox: result

- id: xberg-api-no-extract-url-route
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/api
  prompt: "Which REST route do I call to extract a document from a URL, and which one for a batch of files?"
  behaviour: answer
  must_use: [api-server-mcp]
  must_not_mention: ["POST /extract-url", 'POST /batch\b']
  expect: ["/extract-async"]
  criteria:
    - id: url-is-field
      check: "The answer says URL ingestion is a field on the POST /extract input, not a separate route."
    - id: batch-is-async
      check: "The answer says batches go through POST /extract-async and are polled at /jobs/{job_id}."
  reference:
    facts:
      - "router.rs registers /extract, /extract-async, /jobs/{job_id}, /detect and others; there is no /extract-url or /batch route."
    sources: [crates/xberg/src/api/router.rs]
  sandbox: result

- id: xberg-benchmark-ground-truth-source
  domain: xberg
  repo: xberg
  cwd: tools/benchmark-harness
