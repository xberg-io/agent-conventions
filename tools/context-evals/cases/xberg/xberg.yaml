- id: xberg-release-version-sync
  domain: xberg
  repo: xberg
  cwd: .
  persona: maintainer
  prompt: "I bumped the version in the root Cargo.toml to 1.5.0. What else has to change before I tag?"
  behaviour: answer
  must_use: [xberg-release]
  expect: ["version:sync|versions:sync"]
  criteria:
    - id: sync
      check: "The answer says to run mise run version:sync rather than hand-editing manifests."
    - id: integrations
      check: "The answer says integrations and the Helm chart are synced by scripts/sync_integration_versions.py, not by alef."
    - id: check
      check: "The answer mentions mise run version:check to detect drift."
  reference:
    facts:
      - >-
        Run mise run version:sync instead of hand-editing release manifests; It first runs alef sync-versions
        for Alef-managed binding versions.
      - >-
        The following scripts/sync_integration_versions.py step owns integration versions and the Helm chart,
        which Alef does not synchronize; the task also regenerates the public skills/plugin resources.
      - >-
        Run mise run version:check to detect integration/chart drift; It shows the Cargo version and runs
        sync_integration_versions.py --check; it is not a dry-run of alef sync-versions.
    sources: [mise.toml, scripts/sync_integration_versions.py]
  sandbox: result

