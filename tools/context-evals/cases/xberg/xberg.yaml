- id: xberg-ocr-font-size-comparison
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/ocr
  persona: maintainer
  prompt: "Can I flag headings by thresholding OCR font size at 14 pt, the same way for Tesseract and Paddle output?"
  behaviour: answer
  must_use: [ocr-pipeline-and-quality]
  expect: ["(?i)x_fsize|hocr_font_info"]
  criteria:
    - id: different-quantities
      check: "The answer says Tesseract font size is hOCR typography while Paddle/Sceptre font size is a detection-box proxy, so one threshold does not fit both."
    - id: font-info
      check: "The answer says hocr_font_info must be enabled for Tesseract typography (otherwise sizes fall back to a default)."
  reference:
    facts: ["hocr_parser.rs reads x_fsize, which is present only when the hocr_font_info variable is enabled."]
    sources: [crates/xberg/src/ocr/hocr_parser.rs]
  sandbox: result

