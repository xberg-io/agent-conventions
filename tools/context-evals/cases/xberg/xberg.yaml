- id: xberg-chunking-preset-without-embeddings
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/chunking
  prompt: >-
    I set `preset = "fast"` in the chunking config but my chunks are still 1000 characters. The build uses
    `--features chunking`. Why?
  behaviour: answer
  must_use: [chunking-embeddings]
  expect: ["(?i)embeddings"]
  criteria:
    - id: feature-gate
      check: "The answer says resolve_preset only applies presets under the embeddings feature and is a no-op otherwise."
    - id: fix
      check: "The answer says to enable the embeddings feature (or set max_chars explicitly)."
  reference:
    facts:
      - 'resolve_preset is cfg(feature = "embeddings"); the chunking-without-embeddings variant returns the config unchanged.'
      - "The default chunk size is 1000."
    sources: [crates/xberg/src/core/config/processing.rs]
  sandbox: result

