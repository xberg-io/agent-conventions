- id: xberg-ocr-font-size-comparison
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/ocr
  persona: maintainer
  prompt: "Can I flag headings by thresholding OCR font size at 14 pt, the same way for Tesseract and Paddle output?"
  behaviour: answer
  must_use: [ocr-pipeline-and-quality]
  expect: ["(?i)x_fsize|hocr_font_info"]
  criteria:
    - id: different-quantities
      check: "The answer says Tesseract font size is hOCR typography while Paddle/Sceptre font size is a detection-box proxy, so one threshold does not fit both."
    - id: font-info
      check: "The answer says hocr_font_info must be enabled for Tesseract typography (otherwise sizes fall back to a default)."
  reference:
    facts:
      - >-
        Do not apply one 14 pt threshold to both backends: Tesseract font size comes from hOCR x_fsize
        typography, while Paddle/Sceptre font size is a geometric detection-box proxy; They measure different
        quantities.
      - >-
        Enable hocr_font_info=1 to obtain Tesseract typography; Without it x_fsize is absent and downstream font
        sizes fall back to a default; a missing typography measurement is not comparable to the other backends'
        geometric estimate.
    sources: [crates/xberg/src/ocr/hocr_parser.rs]
  sandbox: result

- id: xberg-pdfium-capability-gap
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/extractors/pdf
  prompt: 'With `backend = "pdfium"` I get text but no annotations or attachments. Is the pdfium engine broken?'
  behaviour: answer
  must_use: [pdf-backends]
  must_not_use: [ocr-pipeline-and-quality]
  criteria:
    - id: narrower
      check: "The answer says the Pdfium backend intentionally supports a narrower surface (text, page count, Info metadata) and warns about the rest."
    - id: native
      check: "The answer says the native backend is the one with annotations, attachments and the full pipeline."
  reference:
    facts:
      - >-
        The pdf-pdfium comparison backend intentionally has a narrower surface: text, page count and
        Info-dictionary metadata; pdfium_engine.rs appends a processing warning about unsupported tables,
        images, annotations, forms, embedded files and OCR fallback.
      - >-
        Use the default native PDF backend for the full pipeline, including annotations and attachments;
        selecting Pdfium does not provide that native capability set.
    sources: [crates/xberg/src/extractors/pdf/pdfium_engine.rs, crates/xberg/Cargo.toml]
  sandbox: result

- id: xberg-plugin-internal-extractor-trait
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/plugins
  prompt: "For a new in-crate extractor, do I implement DocumentExtractor or something else? And what happens if it has the same MIME and priority as an existing one?"
  behaviour: answer
  must_use: [plugin-architecture-patterns]
  expect: ["InternalDocumentExtractor"]
  criteria:
    - id: internal
      check: "The answer says in-crate extractors implement InternalDocumentExtractor and get DocumentExtractor via a blanket impl."
    - id: collision
      check: "The answer says an equal MIME and priority registration replaces the earlier entry (with a warning), so priorities should differ."
  reference:
    facts:
      - >-
        An in-crate extractor implements InternalDocumentExtractor; crates/xberg/src/plugins/extractor/trait.rs
        supplies DocumentExtractor through its blanket impl for InternalDocumentExtractor implementors.
      - >-
        The registry stores one extractor per MIME-type/priority slot; Registering a different extractor at the
        same MIME and priority replaces the earlier slot and emits a warning; give the two extractors distinct
        priorities to keep both reachable.
    sources: [crates/xberg/src/plugins/extractor/trait.rs, crates/xberg/src/plugins/registry/extractor.rs]
  sandbox: result

