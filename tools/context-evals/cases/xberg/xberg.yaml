- id: xberg-office-security-budget
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/extractors
  prompt: "For a new ODG (OpenDocument drawing) extractor, should I validate the zip with ZipBombValidator like the archive extractor does?"
  behaviour: answer
  must_use: [format-specific-extraction]
  expect: ["SecurityBudget"]
  criteria:
    - id: budget
      check: "The answer says Office/ODF XML extractors need SecurityBudget threaded through the XML walkers in addition to ZIP-container validation, and that ZipBombValidator is not a substitute for the XML complexity budget."
    - id: alef-skip
      check: "The answer mentions the extractor struct needs #[cfg_attr(alef, alef(skip))]."
  reference:
    facts:
      - >-
        Use SecurityBudget threaded through the Office/ODF XML walkers to enforce nesting, event/iteration,
        entity and output-growth limits; ZipBombValidator is not a substitute for that XML complexity budget;
        ZIP-container validation is a separate concern, and OdtExtractor also has archive checks.
      - >-
        Put #[cfg_attr(alef, alef(skip))] on the new extractor struct declaration, as on OdtExtractor in
        crates/xberg/src/extractors/odt.rs, so Alef does not try to bind the internal extractor type.
    sources: [crates/xberg/src/extractors/security.rs, crates/xberg/src/extractors/odt.rs]
  sandbox: result

