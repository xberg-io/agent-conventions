# --- path-scoped rules -------------------------------------------------------------------------

- id: xberg-rule-extraction-safety-max-pages
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/extractors
  prompt: "A 4 KB PDF with 200k blank pages made OCR run for an hour despite max_archive_size and the byte limits. Which limit should have stopped it?"
  behaviour: answer
  expect: ["max_pages"]
  criteria:
    - id: max-pages
      check: "The answer says SecurityLimits.max_pages is the only guard on per-page work and defaults to None."
  reference:
    facts: ["extractors/security.rs: pub max_pages: Option<usize> bounds page work; byte limits do not."]
    sources: [crates/xberg/src/extractors/security.rs]
  sandbox: result

