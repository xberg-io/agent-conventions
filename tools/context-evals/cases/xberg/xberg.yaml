- id: xberg-api-no-extract-url-route
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/api
  prompt: "Which REST route do I call to extract a document from a URL, and which one for a batch of files?"
  behaviour: answer
  must_use: [api-server-mcp]
  must_not_mention: ["POST /extract-url", 'POST /batch\b']
  expect: ["/extract-async"]
  criteria:
    - id: url-is-field
      check: "The answer says URL ingestion is a field on the POST /extract input, not a separate route."
    - id: batch-is-async
      check: "The answer says batches go through POST /extract-async and are polled at /jobs/{job_id}."
  reference:
    facts:
      - >-
        URL ingestion is a field on the ExtractInput accepted by POST /extract, not a separate POST /extract-url
        route.
      - >-
        Submit a batch through POST /extract-async and poll GET /jobs/{job_id} for its job status/result; there
        is no POST /batch route; These routes are registered in crates/xberg/src/api/router.rs.
    sources: [crates/xberg/src/api/router.rs]
  sandbox: result

