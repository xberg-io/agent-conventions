# --- path-scoped rules -------------------------------------------------------------------------

- id: xberg-rule-extraction-safety-max-pages
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/extractors
  prompt: "A 4 KB PDF with 200k blank pages made OCR run for an hour despite max_archive_size and the byte limits. Which limit should have stopped it?"
  behaviour: answer
  expect: ["max_pages"]
  criteria:
    - id: max-pages
      check: "The answer says SecurityLimits.max_pages is the only guard on per-page work and defaults to None."
  reference:
    facts:
      - >-
        SecurityLimits.max_pages is the explicit guard on how many pages/slides/frames enter supported per-page
        pipelines and defaults to None, meaning unlimited; Byte-size limits do not bound that count or its
        OCR/layout/rendering work; Set a workload-appropriate page cap explicitly; security.rs documents which
        formats enforce it.
    sources: [crates/xberg/src/extractors/security.rs]
  sandbox: result

- id: xberg-rule-api-compat-deprecation
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src
  prompt: "I renamed the public `split_and_extract` to `extract_segments`. Can I just delete the old name in the next minor release?"
  behaviour: answer
  criteria:
    - id: deprecate
      check: "The answer says to keep the old public name deprecated for at least one minor version before removing it."
    - id: changelog
      check: "The answer says to document the change in CHANGELOG.md."
  reference:
    facts:
      [
        "api-compatibility applies to crates/xberg/src/**: breaking public changes need a major bump; deprecations last at least one minor version.",
      ]
    sources: [.ai-rulez/rules/api-compatibility.md, crates/xberg/src/lib.rs, CHANGELOG.md]
  sandbox: result

- id: xberg-rule-async-select
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/extraction
  prompt: "Should I use tokio::select! with a sleep branch to time out a slow extraction in extraction/?"
  behaviour: answer
  expect: ["tokio::time::timeout"]
  criteria:
    - id: timeout
      check: "The answer says to use tokio::time::timeout, and that tokio::select! is reserved for MCP server and API startup paths."
  reference:
    facts:
      - >-
        Use tokio::time::timeout for a slow extraction, not tokio::select! with a sleep branch; The extraction
        async convention reserves select! for the MCP server and API startup paths, represented by mcp/server.rs
        and api/startup.rs.
    sources: [crates/xberg/src/api/startup.rs, crates/xberg/src/mcp/server.rs]
  sandbox: result

- id: xberg-rule-changelog-ci-entry
  domain: xberg
  repo: xberg
  cwd: .
  prompt: "Add a CHANGELOG.md entry for my change: I split ci-rust.yaml into two jobs and bumped the cargo-deny version."
  behaviour: answer
  criteria:
    - id: no-entry
      check: "The answer says CI and dependency-maintenance changes do not get a CHANGELOG entry because they are not user-visible."
  reference:
    facts:
      - >-
        Do not add a user-facing CHANGELOG entry for CI-only or dependency-maintenance changes; The changelog
        policy omits CI, tests, generators and dependency maintenance unless they affect user-visible behavior,
        compatibility, packaging, installation, performance or security.
    sources: [.ai-rulez/rules/changelog-policy.md, CHANGELOG.md]
  sandbox: result

- id: xberg-rule-measurement-ocr-no-cache
  domain: xberg
  repo: xberg
  cwd: tools/ocr-measure
  persona: maintainer
  prompt: >-
    My OCR sweep runs `xberg extract --ocr-no-cache true` with configs that only set `[ocr] language = "deu"`, but two
    configs produce identical output. Why?
  behaviour: answer
  expect: ["tesseract_config"]
  criteria:
    - id: noop
      check: "The answer says --ocr-no-cache has no effect unless ocr.tesseract_config is set in the config."
    - id: nested-language
      check: "The answer says the [ocr.tesseract_config] block needs its own nested language, since the outer language is read only when tesseract_config is None."
    - id: cache-dir
      check: "The answer recommends a per-invocation XBERG_CACHE_DIR with a guard against an empty path."
  reference:
    facts: ["overrides/ocr.rs warns that --ocr-no-cache has no effect when no tesseract_config is set."]
    sources:
      [crates/xberg-cli/src/commands/overrides/ocr.rs, crates/xberg-cli/src/commands/overrides/tests/ocr_basics.rs]
  sandbox: procedure

- id: xberg-rule-measurement-ratio-vs-count
  domain: xberg
  repo: xberg
  cwd: tools/ocr-measure
  persona: maintainer
  prompt: "My OCR change raises the dictionary-valid-word ratio on 12 of 16 documents. Is that enough to ship it?"
  behaviour: answer
  criteria:
    - id: absolute
      check: "The answer says to judge by the absolute count of valid words, since a ratio rises when the change drops low-quality content."
    - id: distribution
      check: "The answer asks for the distribution (median, cases that moved the other way) or accepted-page comparison rather than a single headline."
  reference:
    facts:
      - >-
        Compare the absolute count of valid words, not just the valid-word ratio: deleting low-quality but real
        content can raise the ratio while reducing useful extracted content.
      - >-
        Report the distribution, including the median and cases that moved the other way, or compare accepted
        pages on the same inputs; A single favorable headline or a largest-delta tail is not a
        population-quality result.
    sources: [.ai-rulez/rules/measurement-discipline.md]
  sandbox: result

- id: xberg-rule-partner-corpus-ids
  domain: xberg
  repo: xberg
  cwd: tools/benchmark-harness
  persona: maintainer
  prompt: "I'm writing up OCR findings on the municipal partner corpus. How should I refer to individual documents in the doc?"
  behaviour: answer
  expect: ["sha1", "relpath|relative"]
  criteria:
    - id: opaque-id
      check: "The answer says to use sha1(relpath)[:10] with relpath relative to the corpus root, not filenames."
    - id: names
      check: "The answer says private individuals' names in quoted text are written as [NAME]."
  reference:
    facts:
      - >-
        Refer to a document by sha1(relpath)[:10], with relpath relative to the corpus root, rather than its
        filename or an absolute-path hash; Pair the opaque ID with its sha256 when an authorized recipient needs
        the exact bytes.
      - >-
        When quoting evidence, replace a private individual's name with [NAME]; Prefer headings, numbers or
        boilerplate; an official acting in an official capacity is distinguished from a private individual by
        the document-corpus-handling policy.
    sources: [.claude/skills/document-corpus-handling/SKILL.md, ATTRIBUTIONS.md]
  sandbox: result

