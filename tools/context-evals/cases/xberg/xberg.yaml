- id: xberg-config-duplicate-tesseract-default
  domain: xberg
  repo: xberg
  cwd: crates/xberg/src/core/config
  persona: maintainer
  prompt: >-
    I changed the default `psm` in TesseractConfig and the CLI picks it up, but the Python binding still uses the old
    value. What did I miss?
  behaviour: answer
  must_use: [config-loading-precedence]
  expect: ['types/formats\.rs', 'ocr/types\.rs']
  criteria:
    - id: two-structs
      check: "The answer says TesseractConfig is defined twice (public types/formats.rs and internal ocr/types.rs), each with its own Default."
    - id: change-both
      check: "The answer says both defaults must be changed."
  reference:
    facts:
      - >-
        TesseractConfig has two separate definitions and Default implementations: the public type in
        crates/xberg/src/types/formats.rs and the internal engine type in crates/xberg/src/ocr/types.rs.
      - >-
        Change both defaults together and keep their synchronization test passing; changing only one leaves the
        public and internal OCR configurations inconsistent.
    sources: [crates/xberg/src/types/formats.rs, crates/xberg/src/ocr/types.rs]
  sandbox: result

