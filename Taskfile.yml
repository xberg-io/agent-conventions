version: "3"

tasks:
  setup:
    desc: Install development hooks
    cmds:
      - task: governance:hooks:install

  governance:hooks:install:
    desc: Provision machine preferences and install reviewed AI governance hooks
    cmds:
      - |
        python3 - <<'PYTHON'
        import pathlib
        import shutil
        import subprocess
        import tomllib

        if shutil.which("ai-rulez") is None:
            raise SystemExit("Install the reviewed ai-rulez CLI before installing hooks")
        preferences = pathlib.Path("poly.local.toml")
        text = preferences.read_text() if preferences.exists() else ""
        data = tomllib.loads(text)
        if "hook_preferences" not in data:
            preferences.write_text(text.rstrip() + '\n\n[hook_preferences]\nchannels = ["system"]\n')
        elif "system" not in data["hook_preferences"].get("channels", []):
            raise SystemExit("Add system to hook_preferences.channels in poly.local.toml")
        subprocess.run(["poly", "hooks", "install"], check=True)
        PYTHON

  governance:check:
    desc: Check materialized local governance outputs against shared sources
    cmds:
      - ai-rulez generate --check --no-local --strict-config

  skills:generate:
    desc: Export public Agent Skills from the shared modules
    cmds:
      - ai-rulez generate --no-local --strict-config

  skills:check:
    desc: Verify public Agent Skills match the shared modules
    cmds:
      - ai-rulez lock --check
      - ai-rulez generate --check --no-local --strict-config

  context:test:
    desc: Unit-test the context harness
    cmds:
      - uv run --no-project --with pyyaml==6.0.2 python -m unittest discover tools/context-evals

  context:cases:
    desc: "Validate the eval cases (task context:cases -- --repo-root ../xberg --repo xberg)"
    cmds:
      - uv run --no-project --with pyyaml==6.0.2 python tools/context-evals/harness.py validate-cases {{.CLI_ARGS}}

  context:exposure:
    desc: "Report start context and leaks for consumer checkouts (task context:exposure -- ../xberg ../sceptre)"
    cmds:
      - python3 tools/context-evals/exposure.py {{.CLI_ARGS}}
