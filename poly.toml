required_version = ">=0.36.0"

[engines.rumdl.lang.markdown.lint]
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076"]

[engines.rumdl.lang.markdown.format]
# MD025 stays enabled for lint but disabled for fmt: rumdl's autofix for a second
# level-1 heading demotes every heading that follows it, which silently reparents a
# whole CHANGELOG under [Unreleased] and breaks release-note extraction. ~keep
disable = ["MD012", "MD013", "MD024", "MD033", "MD036", "MD041", "MD046", "MD051", "MD076", "MD025"]

[engines.typos]
# typos is opt-in in poly v2; this keeps the v1 default (on).
enabled = true

[engines.uncomment]
enabled = true
remove_todos = false
remove_fixme = false
remove_docs = false
use_default_ignores = true
preserve_patterns = [
  "SAFETY",
  "HACK",
  "WORKAROUND",
  "NOTE",
  "Copyright",
  "Licensed",
  "License",
  "SPDX",
  "Apache",
  "MIT",
  "WITHOUT WARRANTIES",
  "limitations under the License",
  "copyright",
  "licensed",
  "license",
  "apache",
  "you may not use this file except in compliance",
  "You may obtain a copy of the License",
  "you may obtain a copy of the license",
  "http://www.apache.org/licenses/LICENSE-2.0",
  "http://www.apache.org/licenses/license-2.0",
  "Unless required by applicable law",
  "unless required by applicable law",
  "distributed under the License",
  "distributed under the license",
  "AS IS",
  "as is",
  "without warranties",
  "specific language governing permissions",
  "limitations under the license",
]

[hooks]
stages = ["pre-commit"]

[hooks.builtin]
lint = { exclude = ["**/*.lock", "/.ai-rulez/.generated-manifest.json", "/adrs/**"] }
fmt = { exclude = ["**/*.lock", "/.ai-rulez/.generated-manifest.json", "/adrs/**"] }
commit = { stages = ["commit-msg"] }
file_safety = { exclude = ["**/*.lock", "/.ai-rulez/.generated-manifest.json"] }

[tools.actionlint]
enabled = true

[[hooks.sources]]
id = "ai-rulez"
git = "https://github.com/Goldziher/ai-rulez.git"
revision = "v5"
hooks = ["ai-rulez-validate"]

[discovery]
exclude = ["/.ai-rulez/.generated-manifest.json", "/adrs/**"]

[engines.harper]
enabled = true
# Off: rules that contradict the org's sentence-case headings and no-Oxford-comma style, or misread technical prose
# (denylist, MB, stdin). ~keep
ignore = [
  "UseTitleCase",
  "OxfordComma",
  "SplitWords",
  "OrthographicConsistency",
  "ExpandMemoryShorthands",
  "ExpandStandardInputAndOutput",
  "ExpandConfiguration",
  "ExpandMinimum",
]
