name: Context exposure
description: >-
  Fail when a repository's generated agent context leaks another product's terms, exceeds its start-token budget,
  or lists a skill or agent description over 250 characters. Run it after ai-rulez has generated the outputs.
inputs:
  budgets:
    description: "Legacy byte/3.9 budget units, one `preset=tokens` per line; calibrated totals are reported separately."
    required: true
  repo-name:
    description: Name the repository is listed under in domains.toml.
    default: ${{ github.event.repository.name }}
  measure-mcp:
    description: >-
      MCP servers (by name, one per line) to start and size by their tool schemas; each needs its command on PATH.
    default: ai-rulez
  working-directory:
    description: Repository root holding the generated outputs.
    default: .
runs:
  using: composite
  steps:
    - name: Check ai-rulez hook version
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HARNESS: ${{ github.action_path }}/../../tools/context-evals
      run: python3 "$HARNESS/hook_pins.py" --consumer .
    - name: Check context exposure
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUDGETS: ${{ inputs.budgets }}
        REPO_NAME: ${{ inputs.repo-name }}
        MEASURE_MCP: ${{ inputs.measure-mcp }}
        HARNESS: ${{ github.action_path }}/../../tools/context-evals
      run: |
        [ -n "$REPO_NAME" ] || { echo "::error::repo-name is empty"; exit 1; }
        args=()
        while read -r budget; do
          [ -n "$budget" ] && args+=(--budget "$budget")
        done <<< "$BUDGETS"
        [ "${#args[@]}" -gt 0 ] || { echo "::error::no budgets given"; exit 1; }
        while read -r server; do
          [ -n "$server" ] && args+=(--measure-mcp "$server")
        done <<< "$MEASURE_MCP"
        python3 "$HARNESS/exposure.py" . --repo-name "$REPO_NAME" --domains "$HARNESS/domains.toml" \
          --fail-on-leak --fail-on-long-descriptions --budget-estimator legacy "${args[@]}" --markdown "$GITHUB_STEP_SUMMARY"
