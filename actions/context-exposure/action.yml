name: Context exposure
description: >-
  Fail when a repository's generated agent context leaks another product's terms or exceeds the start-token budgets
  of its [exposure] table, using ai-rulez's native exposure checks. Run it after ai-rulez has generated the outputs,
  with ai-rulez on PATH.
inputs:
  budgets:
    description: >-
      Deprecated and ignored; a value warns. Set `[exposure] start_budget` and `codex_start_budget` in
      .ai-rulez/config.toml.
    required: false
    default: ""
  repo-name:
    description: Name the repository is listed under in domains.toml.
    default: ${{ github.event.repository.name }}
  measure-mcp:
    description: Deprecated and ignored; a value other than `ai-rulez` warns. Set `[exposure] mcp_server_tokens`.
    default: ai-rulez
  working-directory:
    description: Repository root holding the generated outputs.
    default: .
runs:
  using: composite
  steps:
    - name: Check hook source pins
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        HARNESS: ${{ github.action_path }}/../../tools/context-evals
      run: python3 "$HARNESS/hook_pins.py" --consumer .
    - name: Check context exposure
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        BUDGETS: ${{ inputs.budgets }}
        REPO_NAME: ${{ inputs.repo-name }}
        MEASURE_MCP: ${{ inputs.measure-mcp }}
        HARNESS: ${{ github.action_path }}/../../tools/context-evals
        WORK: ${{ runner.temp }}
      run: SUMMARY="$GITHUB_STEP_SUMMARY" bash "$GITHUB_ACTION_PATH/gate.sh"
